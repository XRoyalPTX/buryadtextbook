name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests & Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: buryadtextbook
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for uncreated migrations
        run: |
          python manage.py makemigrations --check --dry-run
        env:
          DB_NAME: buryadtextbook
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DEBUG: 'True'
          SECRET_KEY: 'ci-secret-key-test-not-for-production'

      - name: Run Django Tests
        run: |
          python manage.py test
        env:
          DB_NAME: buryadtextbook
          DB_USER: postgres
          DB_PASSWORD: password
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DEBUG: 'True'
          SECRET_KEY: 'ci-secret-key-test-not-for-production'

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd /home/xroyalptx/buryadtextbook
            git fetch origin main
            git reset --hard origin/main
            source .venv/bin/activate
            pip install -r requirements.txt
            python manage.py migrate --no-input
            python manage.py collectstatic --no-input
            sudo systemctl restart ${{ secrets.GUNICORN_SERVICE || 'gunicorn' }}
